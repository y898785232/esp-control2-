<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水泵控制系统</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding-top: 40px;
      margin: 0;
    }
    h2 { color: #333; margin-bottom: 5px; }
    .dev-id { color: #888; font-size: 14px; margin-bottom: 30px; }
    
    /* 水泵滑动开关 */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 380px;
      height: 160px;
      margin: 20px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #ccc;
      border-radius: 80px;
      transition: 0.4s;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 140px;
      width: 140px;
      left: 10px;
      bottom: 10px;
      background: white;
      border-radius: 50%;
      transition: 0.4s;
    }
    input:checked + .slider { background: #28a745; }
    input:checked + .slider:before { transform: translateX(210px); }


    .slider span {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 32px;
      font-weight: bold;
      color: white;
    }
    .off { left: 55px; }
    .on { right: 55px; opacity: 0; }
    input:checked + .slider .off { opacity: 0; }
    input:checked + .slider .on { opacity: 1; }


    /* 灯按钮 */
    button {
      width: 280px;
      height: 85px;
      font-size: 28px;
      margin: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .lamp-on  { background: #28a745; color: white; }
    .lamp-off { background: #dc3545; color: white; }
    
    /* 连接状态条 */
    .status-bar {
      display: inline-block;
      padding: 6px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
    }
    .online { background: #e6f7ed; color: #1f8b4c; }
    .offline { background: #ffebeb; color: #dc3545; }
  </style>
</head>
<body>
  <h2>🚰 水泵控制系统</h2>
  <div class="dev-id">设备 ID: device_01</div>
  
  <div id="netStatus" class="status-bar offline">正在连接大棚云端...</div>


  <p><strong>水泵遥控开关</strong></p>
  <label class="toggle-switch">
    <input type="checkbox" id="pumpSwitch" onchange="handlePump(this)">
    <div class="slider">
      <span class="off">🚫 关闭</span>
      <span class="on">✅ 开启</span>
    </div>
  </label>


  <br><hr style="width: 80%; border: 0.5px solid #ddd;"><br>


  <p><strong>💡 大棚照明（灯 1）</strong></p>
  <button id="lampBtn" class="lamp-off" onclick="toggleLamp()">灯 1 关</button>


<script>
// ==================== 🛠️ 参数配置区（完美适配新单片机） ====================
const DEVICE_ID = "device_01"; // 如果有第二台设备，网页这里改成 device_02 即可
const cmdTopic = "home/" + DEVICE_ID + "/pump/cmd";
const statusTopic = "home/" + DEVICE_ID + "/pump/status";


// 💡 修复：改用免费版标准的 443 加密端口与真实域名
const client = mqtt.connect('wss://b7fea2bf.ala.asia-southeast1.emqxsl.com:443/mqtt', {
  clientId: 'web_pump_' + Math.random().toString(16).substr(2,8),
  username: 'eps8266nn',
  password: 'yu155414',
  connectTimeout: 5000
});


let lamp1State = false;


// 连接成功
client.on('connect', () => {
  console.log("MQTT 服务器已连上！");
  const netStatus = document.getElementById("netStatus");
  netStatus.textContent = "🟢 云端已连接";
  netStatus.className = "status-bar online";
  
  // 💡 修复：订阅带设备ID的正确主题
  client.subscribe(statusTopic);
});


// 连接断开
client.on('close', () => {
  const netStatus = document.getElementById("netStatus");
  netStatus.textContent = "🔴 云端已断开";
  netStatus.className = "status-bar offline";
});


// 接收单片机返回的状态
client.on('message', (topic, message) => {
  const msg = message.toString().trim();
  console.log("接收到单片机反馈状态: " + msg);
  
  if (msg === "PUMP_ON") {
    document.getElementById("pumpSwitch").checked = true;
  }
  if (msg === "PUMP_OFF") {
    document.getElementById("pumpSwitch").checked = false;
  }
  if (msg === "ON1") {
    lamp1State = true;
    document.getElementById("lampBtn").textContent = "灯 1 开";
    document.getElementById("lampBtn").className = "lamp-on";
  }
  if (msg === "OFF1") {
    lamp1State = false;
    document.getElementById("lampBtn").textContent = "灯 1 关";
    document.getElementById("lampBtn").className = "lamp-off";
  }
});


// 滑动开关触发逻辑
function handlePump(cb) {
  // 💡 修复：向带设备ID的命令通道发送指令
  client.publish(cmdTopic, cb.checked ? 'PUMP_ON' : 'PUMP_OFF', { qos: 1 });
}


// 按钮控制灯逻辑
function toggleLamp() {
  // 💡 修复：向带设备ID的命令通道发送指令
  client.publish(cmdTopic, lamp1State ? 'OFF1' : 'ON1', { qos: 1 });
}
</script>
</body>
</html>
