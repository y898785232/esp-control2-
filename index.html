<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>水泵控制系统</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding-top: 40px;
      margin: 0;
    }
    h2 { color: #333; margin-bottom: 30px; }
    
    /* 水泵滑动开关 */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 380px;
      height: 160px;
      margin: 20px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #ccc;
      border-radius: 80px;
      transition: 0.4s;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 140px;
      width: 140px;
      left: 10px;
      bottom: 10px;
      background: white;
      border-radius: 50%;
      transition: 0.4s;
    }
    input:checked + .slider { background: #28a745; }
    input:checked + .slider:before { transform: translateX(210px); }


    .slider span {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 32px;
      font-weight: bold;
      color: white;
    }
    .off { left: 55px; }
    .on { right: 55px; opacity: 0; }
    input:checked + .slider .off { opacity: 0; }
    input:checked + .slider .on { opacity: 1; }


    /* 灯按钮 */
    button {
      width: 280px;
      height: 85px;
      font-size: 28px;
      margin: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .lamp-on  { background: #28a745; color: white; }
    .lamp-off { background: #dc3545; color: white; }
  </style>
</head>
<body>
  <h2>🚰 水泵控制系统</h2>
  
  <!-- 水泵滑动开关 -->
  <p><strong>水泵</strong></p>
  <label class="toggle-switch">
    <input type="checkbox" id="pumpSwitch" onchange="handlePump(this)">
    <div class="slider">
      <span class="off">🚫 关闭</span>
      <span class="on">✅ 开启</span>
    </div>
  </label>


  <br><hr><br>


  <!-- 灯1 按钮 -->
  <p><strong>💡 灯 1</strong></p>
  <button id="lampBtn" class="lamp-off" onclick="toggleLamp()">灯 1 关</button>


<script>
const client = mqtt.connect('wss://b7fea2bf.ala.asia-southeast1.emqxsl.com:8084/mqtt', {
  clientId: 'web_pump_' + Math.random().toString(16).substr(2,8),
  username: 'eps8266nn',
  password: 'yu155414'
});


let lamp1State = false;


client.on('connect', () => {
  console.log("MQTT 已连接");
  client.subscribe('home/esp8266/pump/status');
});


client.on('message', (topic, message) => {
  const msg = message.toString();
  
  if (msg === "PUMP_ON") {
    document.getElementById("pumpSwitch").checked = true;
  }
  if (msg === "PUMP_OFF") {
    document.getElementById("pumpSwitch").checked = false;
  }
  if (msg === "ON1") {
    lamp1State = true;
    document.getElementById("lampBtn").textContent = "灯 1 开";
    document.getElementById("lampBtn").className = "lamp-on";
  }
  if (msg === "OFF1") {
    lamp1State = false;
    document.getElementById("lampBtn").textContent = "灯 1 关";
    document.getElementById("lampBtn").className = "lamp-off";
  }
});


function handlePump(cb) {
  client.publish('home/esp8266/pump/cmd', cb.checked ? 'PUMP_ON' : 'PUMP_OFF');
}


function toggleLamp() {
  client.publish('home/esp8266/pump/cmd', lamp1State ? 'OFF1' : 'ON1');
}
</script>
</body>
</html>
