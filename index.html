<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>控制系统</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


<style>
body { text-align:center; font-family:Arial; }


button {
  width:200px;height:80px;font-size:24px;margin:10px;
}


.on { background:green;color:white; }
.off { background:red;color:white; }


.status { margin:10px;padding:8px;display:inline-block; }
</style>
</head>


<body>


<h2>设备控制</h2>


<div id="status">连接中...</div>


<hr>


<h3>灯</h3>
<button id="lampBtn" class="off" onclick="toggleLamp()">关闭</button>


<h3>水泵</h3>
<button id="pumpBtn" class="off" onclick="togglePump()">关闭</button>


<script>


const DEVICE_ID = "device_01";
const BROKER = "wss://b7fea2bf.ala.asia-southeast1.emqxsl.com:8084/mqtt";


const lampCmd = `home/${DEVICE_ID}/lamp1/cmd`;
const pumpCmd = `home/${DEVICE_ID}/pump/cmd`;


const lampStatus = `home/${DEVICE_ID}/lamp1/status`;
const pumpStatus = `home/${DEVICE_ID}/pump/status`;


let lamp = false;
let pump = false;


const client = mqtt.connect(BROKER,{
  username:"eps8266nn",
  password:"yu155414",
  clientId:"web_" + Math.random().toString(16).substr(2,8)
});


client.on("connect", () => {
  document.getElementById("status").innerText = "已连接";


  client.subscribe(lampStatus);
  client.subscribe(pumpStatus);


  // 自动同步状态（关键）
  client.publish(`home/${DEVICE_ID}/cmd`, "QUERY");
});


client.on("message", (topic, msg) => {
  msg = msg.toString();


  if (topic === lampStatus) {
    lamp = (msg === "ON1");
    updateLamp();
  }


  if (topic === pumpStatus) {
    pump = (msg === "PUMP_ON");
    updatePump();
  }
});


/* ================= UI ================= */


function updateLamp(){
  const b = document.getElementById("lampBtn");
  b.innerText = lamp ? "开启" : "关闭";
  b.className = lamp ? "on" : "off";
}


function updatePump(){
  const b = document.getElementById("pumpBtn");
  b.innerText = pump ? "开启" : "关闭";
  b.className = pump ? "on" : "off";
}


function toggleLamp(){
  client.publish(lampCmd, lamp ? "OFF1" : "ON1");
}


function togglePump(){
  client.publish(pumpCmd, pump ? "PUMP_OFF" : "PUMP_ON");
}


</script>


</body>
</html>
