<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>水泵控制系统 - 大门</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 15px 12px;
      margin: 0;
      min-height: 100vh;
    }
    h2 { 
      color: #333; 
      margin: 5px 0 8px; 
      font-size: 22px;
    }
    .dev-id { 
      color: #888; 
      font-size: 13.5px; 
      margin-bottom: 18px; 
    }
    
    /* ==================== 移动端重点缩小 ==================== */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 290px;     /* 明显缩小 */
      height: 110px;        /* 明显缩小 */
      margin: 12px auto;
    }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: #ccc; border-radius: 80px; transition: 0.4s;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }
    .slider:before {
      height: 94px;         /* 缩小 */
      width: 94px;          /* 缩小 */
      left: 8px; bottom: 8px;
      background: white;
      border-radius: 50%; transition: 0.4s;
    }
    input:checked + .slider:before { transform: translateX(175px); }

    .slider span {
      font-size: 24px;      /* 缩小字体 */
    }
    .off { left: 38px; }
    .on { right: 38px; opacity: 0; }

    button {
      width: 100%;
      max-width: 260px;     /* 缩小 */
      height: 68px;         /* 缩小 */
      font-size: 23px;
      margin: 10px auto;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .status-bar {
      padding: 6px 18px;
      font-size: 14.5px;
      margin-bottom: 18px;
    }

    hr { 
      width: 80%; 
      border: 0.5px solid #ddd; 
      margin: 22px auto; 
    }

    /* 超小屏额外优化 */
    @media (max-width: 480px) {
      h2 { font-size: 20px; }
      .toggle-switch { 
        max-width: 275px; 
        height: 105px; 
      }
      .slider:before { 
        height: 88px; 
        width: 88px; 
      }
      input:checked + .slider:before { transform: translateX(165px); }
      button { 
        max-width: 250px; 
        height: 64px; 
        font-size: 22px; 
      }
      .slider span { font-size: 22px; }
    }
  </style>
</head>
<body>
  <h2>🚰 水泵控制系统</h2>
  <div class="dev-id">设备 ID: device_01</div>
  
  <div id="netStatus" class="status-bar offline">正在连接云端...</div>

  <p><strong>水泵遥控开关</strong></p>
  <label class="toggle-switch">
    <input type="checkbox" id="pumpSwitch" onchange="handlePump(this)">
    <div class="slider">
      <span class="off">🚫 关闭</span>
      <span class="on">✅ 开启</span>
    </div>
  </label>

  <hr>

  <p><strong>💡 大门照明（灯 1）</strong></p>
  <button id="lampBtn" class="lamp-off" onclick="toggleLamp()">灯 1 关</button>

<script>
// ==================== 配置区（不变） ====================
const DEVICE_ID = "device_01";
const BROKER_URL = "wss://b7fea2bf.ala.asia-southeast1.emqxsl.com:8084/mqtt";

const cmdTopic    = `home/${DEVICE_ID}/pump/cmd`;
const statusTopic = `home/${DEVICE_ID}/pump/status`;

let lamp1State = false;

const client = mqtt.connect(BROKER_URL, {
  clientId: 'web_' + Math.random().toString(16).substr(2, 8),
  username: 'eps8266nn',
  password: 'yu155414',
  clean: true,
  reconnectPeriod: 5000
});

client.on('connect', () => {
  const statusEl = document.getElementById("netStatus");
  statusEl.textContent = "🟢 云端已连接";
  statusEl.className = "status-bar online";
  client.subscribe(statusTopic, { qos: 1 });
});

client.on('close', () => {
  const statusEl = document.getElementById("netStatus");
  statusEl.textContent = "🔴 云端已断开";
  statusEl.className = "status-bar offline";
});

client.on('message', (topic, message) => {
  const msg = message.toString().trim();
  if (msg === "PUMP_ON") document.getElementById("pumpSwitch").checked = true;
  else if (msg === "PUMP_OFF") document.getElementById("pumpSwitch").checked = false;
  else if (msg === "ON1") {
    lamp1State = true;
    const btn = document.getElementById("lampBtn");
    btn.textContent = "灯 1 开"; btn.className = "lamp-on";
  }
  else if (msg === "OFF1") {
    lamp1State = false;
    const btn = document.getElementById("lampBtn");
    btn.textContent = "灯 1 关"; btn.className = "lamp-off";
  }
});

function handlePump(cb) {
  client.publish(cmdTopic, cb.checked ? 'PUMP_ON' : 'PUMP_OFF', { qos: 1 });
}

function toggleLamp() {
  const cmd = lamp1State ? 'OFF1' : 'ON1';
  client.publish(cmdTopic, cmd, { qos: 1 });
}
</script>
</body>
</html>
