<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大棚智能控制中心</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #333; margin-bottom: 5px; }
        .status-bar { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 20px; }
        .online { background: #e6f7ed; color: #1f8b4c; }
        .offline { background: #ffebeb; color: #dc3545; }
        .card { background: #f8f9fa; border: 1px solid #eed; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 18px; font-weight: bold; color: #444; }
        .btn { padding: 10px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; transition: 0.2s; }
        .btn-on { background: #28a745; }
        .btn-off { background: #dc3545; }
        .state-text { font-size: 14px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>


<div class="container">
    <h2>🍀 我的大棚控制中心</h2>
    <p style="color:#888; font-size:12px; margin-top:0;">设备ID: device_01</p>
    
    <div id="conn-status" class="status-bar offline">正在连接云服务器...</div>


    <div class="card">
      <div>
        <div class="card-title">💡 大棚照明灯</div>
        <div id="lamp-text" class="state-text">状态：未知</div>
      </div>
      <button id="lamp-btn" class="btn btn-off" onclick="toggleLamp()">点击开启</button>
    </div>


    <div class="card">
      <div>
        <div class="card-title">💧 灌溉水泵</div>
        <div id="pump-text" class="state-text">状态：未知</div>
      </div>
      <button id="pump-btn" class="btn btn-off" onclick="togglePump()">点击开启</button>
    </div>
</div>


<script>
    // ==================== 🛠️ MQTT 网页端参数配置 ====================
    // 注意：网页端必须走加密的 wss 协议，端口是 443
    const broker = "wss://b7fea2bf.ala.asia-southeast1.emqxsl.com:443/mqtt";
    const options = {
        connectTimeout: 4000,
        clientId: 'web_' + Math.random().toString(16).substr(2, 8),
        username: 'eps8266nn',
        password: 'yu155414',
    };


    const cmdTopic = "home/device_01/pump/cmd";
    const statusTopic = "home/device_01/pump/status";


    // 记录当前本地状态
    let currentLamp = false;
    let currentPump = false;


    // 开始连接
    console.log("正在连接到 EMQX 云端...");
    const client = mqtt.connect(broker, options);


    // 连接成功回调
    client.on('connect', () => {
        console.log('网页端成功连上 MQTT 服务器！');
        const statusBar = document.getElementById('conn-status');
        statusBar.innerText = "云服务器：已连接";
        statusBar.className = "status-bar online";
        
        // 订阅单片机的状态主题
        client.subscribe(statusTopic);
    });


    // 连接断开回调
    client.on('close', () => {
        const statusBar = document.getElementById('conn-status');
        statusBar.innerText = "云服务器：已断开";
        statusBar.className = "status-bar offline";
    });


    // 接收单片机发来的状态反馈（包括 Retained 消息）
    client.on('message', (topic, payload) => {
        const msg = payload.toString().trim();
        console.log("收到单片机状态:", msg);


        if (msg === "ON1") {
            currentLamp = true;
            document.getElementById('lamp-text').innerText = "状态：🟢 已开启";
            updateButton('lamp-btn', true);
        } else if (msg === "OFF1") {
            currentLamp = false;
            document.getElementById('lamp-text').innerText = "状态：⚪ 已关闭";
            updateButton('lamp-btn', false);
        } else if (msg === "PUMP_ON") {
            currentPump = true;
            document.getElementById('pump-text').innerText = "状态：🔵 水泵运行中";
            updateButton('pump-btn', true);
        } else if (msg === "PUMP_OFF") {
            currentPump = false;
            document.getElementById('pump-text').innerText = "状态：⚪ 水泵已停止";
            updateButton('pump-btn', false);
        }
    });


    // 更新按钮外观
    function updateButton(btnId, isOn) {
        const btn = document.getElementById(btnId);
        if (isOn) {
            btn.innerText = "点击关闭";
            btn.className = "btn btn-on";
        } else {
            btn.innerText = "点击开启";
            btn.className = "btn btn-off";
        }
    }


    // 开关灯发射逻辑
    function toggleLamp() {
        const nextState = currentLamp ? "OFF1" : "ON1";
        client.publish(cmdTopic, nextState, { qos: 1 });
        console.log("网页下发控制命令:", nextState);
    }


    // 开关水泵发射逻辑
    function togglePump() {
        const nextState = currentPump ? "PUMP_OFF" : "PUMP_ON";
        client.publish(cmdTopic, nextState, { qos: 1 });
        console.log("网页下发控制命令:", nextState);
    }
</script>
</body>
</html>
